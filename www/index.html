<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Nudge</title>
<style>
:root{--bg:#f4f1ea;--card:#fffdf8;--ink:#23262b;--mut:#8a8f98;--line:#e2ddd0;--acc:#4f8068;--accS:#dfeae3;--warn:#c4674f;--sh:0 6px 20px rgba(60,50,30,.07)}
:root[data-t=dark]{--bg:#111318;--card:#1a1d24;--ink:#e9e7e1;--mut:#7d828c;--line:#2a2e38;--acc:#8fc5a6;--accS:#22322a;--warn:#e08a72;--sh:0 6px 20px rgba(0,0,0,.35)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,Roboto,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.w{max-width:560px;margin:auto;padding:22px 18px 120px}
header{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:18px}
h1{margin:0;font-size:32px;letter-spacing:-.6px}header small{color:var(--mut)}
h3{margin:0 0 14px;font-size:20px}
.g{background:none;border:0;color:var(--mut);padding:8px}
.tabs{display:flex;background:var(--card);border-radius:16px;padding:4px;margin-bottom:16px;box-shadow:var(--sh)}
.tabs button{flex:1;border:0;background:none;color:var(--mut);padding:10px;border-radius:12px;font:inherit;font-weight:600}
.tabs .on{background:var(--accS);color:var(--acc)}
.c{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:20px;padding:14px;margin-bottom:10px;box-shadow:var(--sh);animation:up .3s}
.ck{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);flex:none;transition:.2s;display:grid;place-items:center}
.ck.on{background:var(--acc);border-color:var(--acc)}
.ck.on:after{content:"\2713";color:var(--bg);font-size:14px;font-weight:700}
.mid{flex:1;min-width:0}.mid b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mid small{color:var(--mut)}.od{color:var(--warn)!important}
.p{width:8px;height:8px;border-radius:50%;background:var(--line);flex:none}.p1{background:#d6b25e}.p2{background:var(--warn)}
.tb{border:0;background:var(--accS);color:var(--acc);border-radius:12px;padding:8px 12px;font:inherit;font-size:13px;font-weight:600}
.fab{position:fixed;right:22px;bottom:calc(24px + env(safe-area-inset-bottom));width:60px;height:60px;border-radius:50%;border:0;background:var(--acc);color:var(--bg);font-size:32px;box-shadow:0 10px 28px rgba(0,0,0,.3)}
#bn{display:none;justify-content:space-between;align-items:center;background:var(--accS);color:var(--acc);border-radius:18px;padding:10px 12px 10px 16px;margin-bottom:14px;font-weight:600}
.bd{position:fixed;inset:0;background:rgba(0,0,0,.45);backdrop-filter:blur(3px);display:none;align-items:flex-end}
.sh{background:var(--card);width:100%;max-width:560px;margin:auto;border-radius:28px 28px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom));animation:up .25s;max-height:90vh;overflow:auto}
input,select{width:100%;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:13px;font:inherit;margin:0 0 10px}
input[type=checkbox]{width:22px;height:22px;margin:0;accent-color:var(--acc)}
label{display:block;color:var(--mut);font-size:12px;margin:2px 0 5px}
.row{display:flex;gap:10px}.row>*{flex:1}
.btn{border:0;border-radius:14px;padding:14px;font:inherit;font-weight:600;background:var(--acc);color:var(--bg)}.ghost{background:var(--accS);color:var(--warn)}
.tg{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}.tg input[type=time]{width:120px;margin:0}.tg span{flex:1}
.empty{text-align:center;color:var(--mut);margin-top:60px}
#ts{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:14px;display:none;font-weight:600}
.tabs button{padding:10px 2px;font-size:14px}
.dn{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.dn b{font-size:17px}.dn .tb{font-size:20px;padding:4px 16px}
.tl{position:relative;background:var(--card);border-radius:20px;box-shadow:var(--sh);overflow:hidden}
.hr{position:absolute;left:0;right:0;border-top:1px solid var(--line)}.hr span{position:absolute;top:4px;left:10px;font-size:11px;color:var(--mut)}
.bk{position:absolute;border-radius:10px;border-left:4px solid var(--acc);background:var(--accS);padding:4px 8px;overflow:hidden;line-height:1.25}
.bk b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.bk small{color:var(--mut);font-size:11px}
.q1{border-left-color:#d6b25e;background:rgba(214,178,94,.2)}.q2{border-left-color:var(--warn);background:rgba(224,138,114,.2)}
.dn2{opacity:.45}.nw{position:absolute;left:44px;right:0;border-top:2px solid var(--warn);z-index:2}
.cu{display:flex;gap:8px}.cu input{margin:0 0 8px}.cu button{flex:none;width:44px;border:0;border-radius:14px;background:var(--accS);color:var(--warn);font-size:18px;margin-bottom:8px}
.add{width:100%;border:1px dashed var(--line);background:none;color:var(--acc);border-radius:14px;padding:11px;font:inherit;font-weight:600;margin-bottom:12px}
@keyframes up{from{opacity:0;transform:translateY(14px)}}
</style></head><body>
<div class="w">
<header><div><small id="dt"></small><h1>Nudge</h1></div>
<button class="g" onclick="settings()" aria-label="Settings"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg></button></header>
<div id="bn"><span id="bt"></span><button class="tb" onclick="S.timer=null;save();tk()">Stop</button></div>
<div class="tabs"><button data-t="today" onclick="setTab('today')">Today</button><button data-t="up" onclick="setTab('up')">Upcoming</button><button data-t="tl" onclick="setTab('tl')">Timeline</button><button data-t="done" onclick="setTab('done')">Done</button></div>
<div id="list"></div></div>
<button class="fab" onclick="edit(0)" aria-label="Add task">+</button>
<div class="bd" id="bd" onclick="if(event.target==this)hideSheet()"><div class="sh" id="sh"></div></div>
<div id="ts"></div>
<script>
const $=s=>document.querySelector(s);
const LN=window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.LocalNotifications;
const PRE=[[0,'None'],[5,'5 min'],[15,'15 min'],[30,'30 min'],[60,'1 hour'],[180,'3 hours'],[1440,'1 day']];
let S=JSON.parse(localStorage.nudge||'null')||{n:100,tasks:[],timer:null,set:{am:true,amT:'09:00',pm:true,pmT:'21:00',pre:15,theme:'',sound:''}};
let tab='today';
S.tasks.forEach(t=>{t.st=t.st||t.due;t.cu=t.cu||[]});
const sod=t=>{const d=new Date(t);d.setHours(0,0,0,0);return d.getTime()};
const tm=t=>new Date(t).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});
const rng=t=>sod(t.st)==sod(t.due)?fd(t.st)+' – '+tm(t.due):fd(t.st)+' – '+fd(t.due);
const rl=t=>{const n=Date.now();return n<t.st?'starts '+rel(t.st):n<t.due?'ongoing':rel(t.due)};
let tdy=sod(Date.now()),CU=[];
const save=()=>{localStorage.nudge=JSON.stringify(S);sync()};
const esc=s=>String(s).replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
const opt=(a,sel)=>a.map(([v,l])=>`<option value="${v}" ${String(v)==String(sel)?'selected':''}>${l}</option>`).join('');
const lv=t=>new Date(t-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,16);
const fd=t=>new Date(t).toLocaleString([],{weekday:'short',day:'numeric',month:'short',hour:'numeric',minute:'2-digit'});
const rel=t=>{const d=t-Date.now(),m=Math.round(Math.abs(d)/6e4),s=m<60?m+'m':m<1440?Math.round(m/60)+'h':Math.round(m/1440)+'d';return d<0?'overdue '+s:'in '+s};
const fm=n=>n>=1440?'1 day':n>=60?n/60+' h':n+' min';
function toast(m){const e=$('#ts');e.textContent=m;e.style.display='block';setTimeout(()=>e.style.display='none',2200)}
const showSheet=h=>{$('#sh').innerHTML=h;$('#bd').style.display='flex'};
const hideSheet=()=>$('#bd').style.display='none';
function theme(){document.documentElement.dataset.t=S.set.theme||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark')}

function chId(){return 'tasks_'+(S.set.sound||'default')}
async function ensureChannel(){
  if(!LN)return;
  try{await LN.createChannel({id:chId(),name:'Task reminders',importance:5,visibility:1,vibration:true,...(S.set.sound?{sound:S.set.sound+'.wav'}:{})})}catch(e){}
}
async function initN(){
  if(!LN)return;
  try{
    await ensureChannel();
    const r=await LN.checkPermissions();if(r.display!=='granted')await LN.requestPermissions();
  }catch(e){}
  sync();
}
async function sync(){
  if(!LN)return;
  try{
    const p=await LN.getPending();
    if(p.notifications.length)await LN.cancel({notifications:p.notifications.map(x=>({id:x.id}))});
    const now=Date.now(),L=[],pend=S.tasks.filter(t=>!t.done),CH=chId();
    const add=(id,at,title,body)=>{if(at>now)L.push({id,title,body,channelId:CH,schedule:{at:new Date(at),allowWhileIdle:true}})};
    pend.forEach(t=>{
      const b=t.id*100;
      if(t.pre>0)add(b+1,t.st-t.pre*6e4,'Starting soon: '+t.title,'Starts in '+fm(t.pre));
      add(b+2,t.st,'Start now: '+t.title,t.note||'Time to begin');
      t.cu.slice(0,20).forEach((c,i)=>add(b+10+i,c.at,t.title,c.m||'Check-in'));
      add(b+3,t.due,'Time is up: '+t.title,'Scheduled time has ended');
    });
    if(S.timer)add(S.timer.id*100+4,S.timer.end,'Timer finished','"'+S.timer.title+'" - nice work');
    const k=pend.length,body=k?k+' task'+(k>1?'s':'')+' pending. Take a look.':'Nothing pending. Plan something?';
    [['am',1,'Good morning'],['pm',2,'Evening check-in']].forEach(([key,id,ti])=>{
      if(S.set[key]){const[h,m]=S.set[key+'T'].split(':').map(Number);L.push({id,title:ti,body,channelId:CH,schedule:{on:{hour:h,minute:m},allowWhileIdle:true}})}
    });
    if(L.length)await LN.schedule({notifications:L});
  }catch(e){console.log(e)}
}

function render(){
  if(tab=='tl')return tline();
  const eod=new Date();eod.setHours(23,59,59,999);
  const f={today:t=>!t.done&&t.st<=eod,up:t=>!t.done&&t.st>eod,done:t=>t.done}[tab];
  const L=S.tasks.filter(f).sort((a,b)=>a.st-b.st);
  $('#list').innerHTML=L.length?L.map(t=>`<div class="c" onclick="edit(${t.id})"><div class="ck ${t.done?'on':''}" onclick="event.stopPropagation();done(${t.id})"></div><div class="mid"><b>${esc(t.title)}</b><small class="${!t.done&&t.due<Date.now()?'od':''}">${rng(t)}${t.done?'':' · '+rl(t)}${t.rep?' · repeats':''}</small></div><span class="p p${t.pr}"></span>${t.done?'':`<button class="tb" onclick="event.stopPropagation();tsheet(${t.id})">Timer</button>`}</div>`).join(''):'<p class="empty">Nothing here.<br>Tap + to add a task.</p>';
}
function tline(){
  const H=56,a=tdy,z=a+864e5;
  const L=S.tasks.filter(t=>t.st<z&&t.due>a).map(t=>({t,s:Math.max(t.st,a),e:Math.min(t.due,z)})).sort((x,y)=>x.s-y.s);
  let cur=null,mx=0;
  L.forEach(b=>{
    if(!cur||b.s>=mx){cur={cols:[]};mx=0}
    let c=cur.cols.findIndex(e=>e<=b.s);if(c<0){c=cur.cols.length;cur.cols.push(0)}
    cur.cols[c]=b.e;b.c=c;b.g=cur;mx=Math.max(mx,b.e);
  });
  let h=`<div class="dn"><button class="tb" onclick="nd(-1)">‹</button><b>${new Date(a).toLocaleDateString([],{weekday:'long',day:'numeric',month:'short'})}</b><button class="tb" onclick="nd(1)">›</button></div><div class="tl" id="tl" style="height:${24*H}px">`;
  for(let i=0;i<24;i++)h+=`<div class="hr" style="top:${i*H}px"><span>${i%12||12}${i<12?'a':'p'}</span></div>`;
  L.forEach(b=>{const w=100/b.g.cols.length,t=b.t;
    h+=`<div class="bk q${t.pr} ${t.done?'dn2':''}" style="top:${(b.s-a)/36e5*H}px;height:${Math.max((b.e-b.s)/36e5*H,24)}px;left:calc(48px + (100% - 52px)*${b.c*w/100});width:calc((100% - 52px)*${w/100} - 3px)" onclick="edit(${t.id})"><b>${esc(t.title)}</b><small>${tm(t.st)}–${tm(t.due)}</small></div>`});
  const n=Date.now();if(n>=a&&n<z)h+=`<div class="nw" style="top:${(n-a)/36e5*H}px"></div>`;
  $('#list').innerHTML=h+'</div>';
}
function fTl(){
  const n=Date.now(),a=tdy,f=a==sod(n)?n:(S.tasks.filter(t=>t.st>=a&&t.st<a+864e5).map(t=>t.st).sort((x,y)=>x-y)[0]||a+8*36e5);
  window.scrollTo(0,Math.max(0,$('#tl').offsetTop+(f-a)/36e5*56-140));
}
function nd(n){const d=new Date(tdy);d.setDate(d.getDate()+n);tdy=d.getTime();render();fTl()}
function setTab(t){tab=t;document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t==t));render();if(t=='tl')fTl()}
function done(id){
  const t=S.tasks.find(x=>x.id==id);
  if(t.rep&&!t.done){const d=t.rep*864e5;do{t.st+=d;t.due+=d;t.cu.forEach(c=>c.at+=d)}while(t.due<=Date.now());toast('Next: '+fd(t.st))}else t.done=!t.done;
  save();render();
}
function rcu(){$('#cl').innerHTML=CU.map((c,i)=>`<div class="cr"><div class="cu"><input type="datetime-local" value="${lv(c.at)}" onchange="CU[${i}].at=new Date(this.value).getTime()"><button onclick="CU.splice(${i},1);rcu()">×</button></div><input placeholder="Message (optional)" value="${esc(c.m||'')}" onchange="CU[${i}].m=this.value"></div>`).join('')}
function addC(){const s=new Date($('#f3').value).getTime(),e=new Date($('#f7').value).getTime();CU.push({at:Math.round((s+e)/12e4)*6e4||Date.now()+36e5,m:''});rcu()}
function edit(id){
  const t=S.tasks.find(x=>x.id==id)||(()=>{let s;if(tab=='tl'&&tdy!=sod(Date.now()))s=tdy+9*36e5;else{const d=new Date();d.setHours(d.getHours()+1,0,0,0);s=d.getTime()}return{title:'',note:'',st:s,due:s+36e5,pre:S.set.pre,pr:1,rep:0,cu:[]}})();
  CU=t.cu.map(c=>({...c}));
  showSheet(`<h3>${id?'Edit task':'New task'}</h3>
<input id="f1" placeholder="What needs doing?" value="${esc(t.title)}">
<input id="f2" placeholder="Note (optional)" value="${esc(t.note||'')}">
<label>Starts</label><input id="f3" type="datetime-local" value="${lv(t.st)}">
<label>Ends</label><input id="f7" type="datetime-local" value="${lv(t.due)}">
<div class="row"><div><label>Remind before start</label><select id="f4">${opt(PRE,t.pre)}</select></div><div><label>Priority</label><select id="f5">${opt([[0,'Low'],[1,'Medium'],[2,'High']],t.pr)}</select></div></div>
<label>Custom reminders (between start and end)</label><div id="cl"></div><button class="add" onclick="addC()">+ Add custom reminder</button>
<label>Repeat</label><select id="f6">${opt([[0,'Never'],[1,'Daily'],[7,'Weekly']],t.rep)}</select>
<div class="row"><button class="btn" onclick="saveT(${id})">Save</button>${id?`<button class="btn ghost" onclick="delT(${id})">Delete</button>`:''}</div>`);
  rcu();
}
function saveT(id){
  const title=$('#f1').value.trim();if(!title)return toast('Add a title');
  const s=new Date($('#f3').value).getTime(),e=new Date($('#f7').value).getTime();
  if(!s||!e)return toast('Pick start and end');
  if(e<=s)return toast('End must be after start');
  if(CU.some(c=>!(c.at>=s&&c.at<=e)))return toast('Reminders must be between start and end');
  let t=S.tasks.find(x=>x.id==id);if(!t){t={id:S.n++,done:false};S.tasks.push(t)}
  Object.assign(t,{title,note:$('#f2').value.trim(),st:s,due:e,cu:CU.map(c=>({at:c.at,m:(c.m||'').trim()})).sort((x,y)=>x.at-y.at),pre:+$('#f4').value,pr:+$('#f5').value,rep:+$('#f6').value});
  hideSheet();save();render();
}
function delT(id){S.tasks=S.tasks.filter(x=>x.id!=id);if(S.timer&&S.timer.id==id)S.timer=null;hideSheet();save();render();tk()}

function tsheet(id){
  const t=S.tasks.find(x=>x.id==id);
  showSheet(`<h3>Focus timer</h3><p style="color:var(--mut);margin-top:0">${esc(t.title)}</p>${[10,25,45,60].map(m=>`<button class="tb" style="margin:0 8px 10px 0" onclick="startT(${id},${m})">${m} min</button>`).join('')}
<div class="row"><input id="cm" type="number" min="1" placeholder="Custom minutes"><button class="btn" style="margin-bottom:10px" onclick="startT(${id},+$('#cm').value)">Start</button></div>`);
}
function startT(id,m){
  if(!m||m<1)return toast('Enter minutes');
  const t=S.tasks.find(x=>x.id==id);S.timer={id,title:t.title,end:Date.now()+m*6e4};
  hideSheet();save();tk();
}
function tk(){
  const T=S.timer,b=$('#bn');
  if(!T){b.style.display='none';return}
  const r=T.end-Date.now();
  if(r<=0){S.timer=null;save();b.style.display='none';toast('Timer finished');return}
  b.style.display='flex';
  $('#bt').textContent=T.title.slice(0,22)+'  '+String(Math.floor(r/6e4)).padStart(2,0)+':'+String(Math.floor(r/1e3)%60).padStart(2,0);
}

function settings(){
  const s=S.set;
  showSheet(`<h3>Settings</h3>
<div class="tg"><span>Morning check-in</span><input type="time" value="${s.amT}" onchange="S.set.amT=this.value;save()"><input type="checkbox" ${s.am?'checked':''} onchange="S.set.am=this.checked;save()"></div>
<div class="tg"><span>Evening check-in</span><input type="time" value="${s.pmT}" onchange="S.set.pmT=this.value;save()"><input type="checkbox" ${s.pm?'checked':''} onchange="S.set.pm=this.checked;save()"></div>
<label>Default remind-before</label><select onchange="S.set.pre=+this.value;save()">${opt(PRE,s.pre)}</select>
<label>Theme</label><select onchange="S.set.theme=this.value;save();theme()">${opt([['','Auto'],['dark','Dark'],['light','Light']],s.theme)}</select>
<label>Notification sound</label><select onchange="S.set.sound=this.value;save();ensureChannel();sync()">${opt([['','Default'],['chime','Chime'],['ping','Ping'],['gentle','Gentle']],s.sound)}</select>
<p class="empty" style="margin:0 0 10px;font-size:12px;text-align:left">Android can't play video (mp4) as a notification sound, only short audio clips - pick one above.</p>
<button class="btn" style="width:100%" onclick="test()">Send test notification</button>
<p class="empty" style="margin:14px 0 0;font-size:12px">Late reminders? Phone Settings > Apps > Nudge > Battery > Unrestricted.</p>`);
}
async function test(){
  if(!LN)return toast('Works in the phone app only');
  await ensureChannel();
  await LN.schedule({notifications:[{id:9,title:'Nudge works',body:'Reminders are set up.',channelId:chId(),schedule:{at:new Date(Date.now()+5e3),allowWhileIdle:true}}]});
  hideSheet();toast('Close the app. Arrives in 5 s');
}

$('#dt').textContent=new Date().toLocaleDateString([],{weekday:'long',day:'numeric',month:'long'});
theme();initN();setTab('today');tk();
setInterval(tk,1000);setInterval(render,6e4);
document.addEventListener('visibilitychange',()=>{if(!document.hidden){sync();render()}});
</script></body></html>
